<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Verificar restricciones</title></head><body><header><strong>TURNO<span>PRO</span></strong></header><main class="card narrow"><h1>Mis restricciones</h1><p id="message">Cargando...</p><div id="details"></div><button id="confirm" hidden>Confirmar que están correctas</button><button id="correct" class="secondary" hidden>Solicitar corrección</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script>const db=window.supabase.createClient(APP_CONFIG.supabaseUrl,APP_CONFIG.supabaseAnonKey),token=new URLSearchParams(location.search).get('token');const msg=document.getElementById('message');async function send(action){try{let {data,error}=await db.functions.invoke('verify-restrictions',{body:{action,token}});if(error)throw error;if(data.error)throw Error(data.error);if(action==='read'){msg.textContent='Revisa los datos. Si necesitas cambios, solicita corrección al gerente.';document.getElementById('details').textContent=data.employee+' · '+data.blocks.map(b=>`Día ${b.weekday}: ${b.starts_at}–${b.ends_at}`).join(' | ');document.getElementById('confirm').hidden=false;document.getElementById('correct').hidden=false}else{msg.textContent=action==='confirm'?'Confirmación registrada':'Solicitud de corrección registrada';document.getElementById('confirm').hidden=document.getElementById('correct').hidden=true}}catch(e){msg.textContent='No se pudo procesar: '+e.message}}document.getElementById('confirm').onclick=()=>send('confirm');document.getElementById('correct').onclick=()=>send('correction');if(token)send('read');else msg.textContent='Enlace inválido';</script></body></html>
